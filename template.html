<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAGE TITLE — Nicky Dominique Malone</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--
  HOW TO ADD A NEW PAGE
  1. Duplicate this file, rename it (lowercase-with-hyphens.html).
  2. Fill in the title tag above and the eyebrow/h1 below.
  3. Write your content inside <main>. Use <h2>, <p>, <img>, etc.
  4. Open js/site.js and add one line to the NAV array pointing
     to your new file. It'll appear in the nav on every page.
-->
<div id="site-shell">
  <div id="site-nav"></div>
  <main class="content">
    <p class="eyebrow">Section</p>
    <h1>Page Title</h1>
    <p>Start writing here.</p>
  </main>
</div>
<div id="site-footer" class="site-footer"></div>
<script src="js/site.js"></script>
</body>
</html>
